# ==============================================================================
# Pipeline de verificacao. Roda em todo Pull Request para develop e main.
#
# Nenhuma credencial da AWS e usada aqui. Toda checagem e estatica: o
# "terraform init" roda com -backend=false e o "validate" nao fala com a API da
# AWS. Uma pipeline que nao precisa de segredo nao pode vazar segredo.
#
# Toda action e fixada por SHA de commit, nao por tag. Tag no Git e mutavel:
# quem controla o repositorio da action pode apontar v4 para outro commit e a
# pipeline passa a executar codigo diferente sem que nada mude neste repo. Foi
# exatamente o vetor do comprometimento de tj-actions/changed-files em 2025.
# O comentario ao lado registra qual versao aquele SHA representa.
# ==============================================================================

name: ci

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop

# Menor privilegio para o token da pipeline: leitura do conteudo e nada mais.
# O default do GitHub pode ser bem mais amplo, inclusive escrita.
permissions:
  contents: read

# Um push novo no mesmo PR cancela a execucao anterior, que ja esta obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform fmt e validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Instala Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Formatacao
        run: terraform fmt -check -recursive -diff

      - name: Init sem backend
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  iac-misconfig:
    name: trivy - configuracao insegura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Analisa o HCL em busca de configuracao insegura: recurso sem cifragem,
      # porta aberta para o mundo, IMDSv1 permitido, IAM com curinga.
      # Excecoes aceitas ficam declaradas e justificadas em .trivyignore.
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore
          hide-progress: false

  secrets:
    name: gitleaks - segredo versionado
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Historico completo: o objetivo e detectar segredo em QUALQUER commit,
          # nao apenas no estado atual da arvore. Segredo removido num commit
          # posterior continua recuperavel e continua comprometido.
          fetch-depth: 0

      - name: Instala Gitleaks
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Varredura do historico
        run: gitleaks git --no-banner --redact --verbose --exit-code 1 .
